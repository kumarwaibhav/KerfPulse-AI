# Optional LOCAL identity-provider integration profile. Not a public IdP deployment.
services:
  identity:
    image: quay.io/keycloak/keycloak:26.4.7
    profiles: [identity]
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:?Set local identity administrator name}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Set random local identity administrator password}
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - identity-data:/opt/keycloak/data
      - ./deploy/identity-realm.json:/opt/keycloak/data/import/kerfpulse.json:ro
    mem_limit: 768m
    restart: unless-stopped
  api:
    environment:
      PDM_OIDC_ISSUER: http://localhost:8080/realms/kerfpulse
      PDM_OIDC_CLIENT_ID: kerfpulse
      PDM_PUBLIC_URL: http://localhost:8000
      PDM_OIDC_ALLOW_LOOPBACK_HTTP: "true"
      PDM_OIDC_BACKCHANNEL_URL: http://identity:8080
volumes:
  identity-data:
