name: Verify engineering build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-and-web:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Reproduce measured benchmark assets and build frontend
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Python regression suite
        shell: pwsh
        run: .venv/Scripts/python.exe -m pytest -q
      - name: Check working-tree formatting
        shell: pwsh
        run: git diff --check
      # GPU/raw-data, Compose/browser, real IdP and field gates have separate receipts.
      # Passing this job does not certify plant readiness or predictive superiority.
